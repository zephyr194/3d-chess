<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="山河为局，一子成军。在山林、渡口与关隘之间，展开一局低多边形 3D 中国象棋。" />
    <meta name="theme-color" content="#263a31" />
    <title>山河弈境 · 3D象棋</title>
  </head>
  <body>
    <main id="app">
      <section class="game-shell">
        <header class="topbar">
          <div class="brand"><span class="brand-seal" aria-hidden="true">弈</span><div>
            <p class="eyebrow">SHANHE · XIANGQI</p>
            <h1>山河弈境</h1>
          </div></div><p class="campaign-note">山河为局 <span>·</span> 一子成军</p>
          <div class="turn-pill" id="turn-pill"><span></span><strong>红方行军</strong></div>
        </header>

        <section class="status-card" aria-label="当前战况">
          <span class="status-seal" aria-hidden="true">战报</span>
          <div class="status-copy"><h2 id="status-title">红方整军待发</h2><p id="status-detail">选择一枚红方棋子开始行军。</p></div>
          <div class="legend" aria-label="棋子标记"><span><i class="red"></i>红方</span><span><i class="black"></i>黑方</span><span><i class="move"></i>可移动</span></div>
        </section>

        <div class="viewport-wrap">
          <canvas id="game-canvas" tabindex="0" aria-label="可操作的3D中国象棋棋盘，WASD或方向键平移视角" aria-keyshortcuts="W A S D ArrowUp ArrowDown ArrowLeft ArrowRight"></canvas>
          <div class="map-compass" aria-hidden="true"><span>北</span><i></i><span>南</span></div>
          <section id="battle-banner" class="battle-banner" role="status" aria-live="polite" aria-atomic="true" hidden>
            <span class="banner-plate banner-plate-left" aria-hidden="true"></span><span class="banner-plate banner-plate-right" aria-hidden="true"></span>
            <span class="banner-seal" data-banner-label></span>
            <div class="banner-copy"><span class="banner-kicker" aria-hidden="true">山河战报</span><strong data-banner-title></strong><p data-banner-detail></p></div>
            <span class="banner-weapons" aria-hidden="true"><i></i><i></i></span>
            <span class="banner-clash" aria-hidden="true"><i></i><i></i></span>
            <span class="banner-sparks" aria-hidden="true">
              <i style="--dx:-130px;--dy:-30px;--turn:-20deg"></i><i style="--dx:-110px;--dy:22px;--turn:20deg"></i><i style="--dx:-80px;--dy:-50px;--turn:40deg"></i><i style="--dx:-45px;--dy:38px;--turn:-25deg"></i><i style="--dx:-20px;--dy:-44px;--turn:70deg"></i>
              <i style="--dx:25px;--dy:37px;--turn:80deg"></i><i style="--dx:50px;--dy:-42px;--turn:-70deg"></i><i style="--dx:85px;--dy:28px;--turn:25deg"></i><i style="--dx:115px;--dy:-31px;--turn:-20deg"></i><i style="--dx:140px;--dy:12px;--turn:15deg"></i>
            </span>
          </section>
          <div class="battle-toast" id="battle-toast" role="status"></div>
          <section class="tactical-map" aria-label="棋局图"><div id="tactical-panel" hidden><div class="tactical-heading"><strong>棋局</strong><span>黑方在上 · 红方在下</span></div><div class="tactical-paper"><div id="tactical-board" role="group" aria-label="标准象棋布局"></div></div><p id="tactical-caption" aria-live="polite"></p></div><button id="tactical-toggle" aria-expanded="false" aria-controls="tactical-panel">看棋局 · M</button></section>
          <div id="route-caption" class="route-caption" hidden></div>
          <div class="hint">WASD / 方向键平移 · 滚轮缩放 · 拖动旋转 · 悬停落点看道路</div>
        </div>

        <aside class="control-panel" aria-label="行军操作台">
          <div class="controls">
            <label class="speed-control" for="speed-select">
              <span>行军速度</span>
              <select id="speed-select" aria-describedby="speed-feedback">
                <option value="3">疾行 · 3×</option><option value="1.7">快速 · 1.7×</option>
                <option value="1" selected>标准 · 1×</option><option value="0.62">电影 · 0.62×</option><option value="0.25">慢赏 · 0.25×</option>
              </select>
              <small id="speed-feedback" aria-live="polite">途中调整，即时生效</small>
            </label>
            <label class="pace-control" for="pace-select">
              <span>行军动作</span>
              <select id="pace-select" aria-describedby="pace-feedback">
                <option value="walk" selected>行走</option><option value="run">奔跑</option>
              </select>
              <small id="pace-feedback">桥栈自动收步，速度独立调节</small>
            </label>
            <div class="view-controls" role="group" aria-label="战场视角">
              <button id="landscape-button" class="secondary">战场全景</button><button id="view-button" class="secondary">恢复俯视</button>
            </div>
            <button id="ambience-button" class="secondary" aria-pressed="true" title="林木、水流与微风遵循系统的减少动态效果设置">风物：流动</button>
            <details class="sound-settings"><summary>战场声音</summary>
              <div class="audio-controls">
                <button id="music-button" class="secondary" aria-pressed="true">战鼓：开启</button><button id="sound-button" class="secondary" aria-pressed="true">音效：开启</button>
                <label class="volume-label" for="music-volume"><span>战鼓音量</span><input id="music-volume" type="range" min="0" max="100" value="28" aria-label="战鼓音量" /></label>
                <p id="music-status" class="music-status">点击棋盘后启奏</p>
              </div>
            </details>
            <button id="reset-button" class="primary">重新布阵</button>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
